<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ねむり帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a bedside notebook — now-card, period, totals, 24h sleep diary, record list */
:root{
  --bg:#eceff6; --surface:#fbfbfe; --sunk:#e3e7f1; --fg:#1b2034; --muted:#5b627a; --line:#d4d9e6;
  --sleep:#3b4799; --nap:#8f99d8; --wake:#e9dfc9; --accent:#b97a1f; --accent-ink:#fff; --danger:#b23d36; --ok:#2f7a55;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11142a; --surface:#1a1e38; --sunk:#151931; --fg:#e7e9f4; --muted:#9ca2bf; --line:#2d3255;
  --sleep:#7f8ff2; --nap:#4b5599; --wake:#3a3527; --accent:#e5b25e; --accent-ink:#1b1606; --danger:#e57c73; --ok:#6cc69a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11142a; --surface:#1a1e38; --sunk:#151931; --fg:#e7e9f4; --muted:#9ca2bf; --line:#2d3255;
  --sleep:#7f8ff2; --nap:#4b5599; --wake:#3a3527; --accent:#e5b25e; --accent-ink:#1b1606; --danger:#e57c73; --ok:#6cc69a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0;letter-spacing:.04em}
h2{font-family:var(--f-display);font-weight:700;font-size:1.08rem;margin:0;text-wrap:balance}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top small{color:var(--muted);font-size:.8rem}
.acct{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:5px;vertical-align:middle}
.sync-dot.on{background:var(--ok)} .sync-dot.err{background:var(--danger)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:transparent}
.btn.small{padding:4px 11px;font-size:.85rem}
.notice{font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px}

/* now card */
.now{background:var(--sleep);color:#fff;border-radius:var(--r);padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.now.awake{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.now .lab{font-size:.78rem;letter-spacing:.12em;opacity:.8}
.now .big{font-family:var(--f-num);font-size:2rem;font-weight:600;line-height:1.2}
.now .sub{font-size:.85rem;opacity:.85}
.now .acts{display:flex;gap:8px;flex-wrap:wrap}
.now.asleep .btn.primary{background:#fff;color:#1b2034}
.rate{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;font-size:1.3rem;line-height:1;padding:2px;color:var(--line)}
.stars button.on{color:var(--accent)}

/* period */
.period{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.custom{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem}
.custom input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.range{color:var(--muted);font-size:.85rem}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:.76rem;color:var(--muted);letter-spacing:.06em}
.stat .v{font-family:var(--f-num);font-size:1.45rem;font-weight:600;line-height:1.25}
.stat .v small{font-size:.8rem;font-weight:400;color:var(--muted);margin-left:2px}
.stat .d{font-size:.78rem;color:var(--muted)}
.stat.key .v{color:var(--sleep)}
.pos{color:var(--ok)} .neg{color:var(--danger)}
.goal{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.goal input{width:4.5em;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 6px}

/* diary */
.diary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin:6px 0 10px}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.drow{display:grid;grid-template-columns:4.6em 1fr 3.6em;gap:8px;align-items:center;height:20px}
.drow .dl{font-size:.78rem;color:var(--muted);white-space:nowrap}
.drow .dl.we{color:var(--accent)}
.drow .dt{font-family:var(--f-num);font-size:.76rem;text-align:right;font-variant-numeric:tabular-nums}
.track{position:relative;height:13px;background:var(--wake);border-radius:3px;overflow:hidden}
.track.future{background:transparent;border:1px dashed var(--line)}
.seg{position:absolute;top:0;bottom:0;background:var(--sleep)}
.seg.nap{background:var(--nap)}
.seg.live{background:repeating-linear-gradient(45deg,var(--sleep) 0 5px,var(--nap) 5px 9px)}
.axis{display:grid;grid-template-columns:4.6em 1fr 3.6em;gap:8px;margin-top:4px}
.ticks{position:relative;height:16px;font-family:var(--f-num);font-size:.68rem;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.diary .more{font-size:.78rem;color:var(--muted);margin-top:6px}

/* list */
.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:8px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.rec .when{font-family:var(--f-num);font-size:.92rem;font-variant-numeric:tabular-nums}
.rec .when b{font-weight:600}
.rec .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted);grid-column:1/-1}
.rec .meta .sl{color:var(--sleep);font-weight:700}
.rec .meta .ac{color:var(--fg)}
.rec .note{grid-column:1/-1;font-size:.86rem;white-space:pre-wrap;overflow-wrap:anywhere}
.rec .ops{display:flex;gap:6px;align-items:start}
.tag{font-size:.72rem;border-radius:4px;padding:1px 6px;background:var(--sunk);color:var(--muted)}
.tag.nap{background:var(--nap);color:#fff}
.tag.live{background:var(--accent);color:var(--accent-ink)}
.warn{color:var(--danger)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,12,28,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:16px}
@media (min-width:560px){.overlay{align-items:center}}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.field input[type=datetime-local],.field textarea,.field select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);font-size:1rem;width:100%}
.field textarea{min-height:64px;resize:vertical}
.row2{display:flex;gap:6px;flex-wrap:wrap}
.preview{font-family:var(--f-num);font-size:.95rem;color:var(--fg);background:var(--sunk);border-radius:8px;padding:8px 10px}
.err{color:var(--danger);font-size:.85rem}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.check{display:flex;gap:6px;align-items:center;font-size:.9rem;color:var(--fg)}

/* activity block under each sleep */
.actblk{grid-column:1/-1;border-top:1px dashed var(--line);margin-top:4px;padding-top:10px;display:flex;flex-direction:column;gap:8px}
.actblk .ah{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:.85rem;color:var(--muted)}
.actblk .ah b{color:var(--fg)}
.dz{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.dz button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-num);font-size:.8rem;padding:0}
.dz button.on{background:var(--dz);color:#fff;border-color:transparent;font-weight:600}
.dz .ends{font-size:.7rem;color:var(--muted);width:100%;display:flex;justify-content:space-between;max-width:310px}
.naps{display:flex;flex-direction:column;gap:4px}
.nap{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.85rem;background:var(--sunk);border-radius:8px;padding:5px 6px 5px 10px}
.nap .t{font-family:var(--f-num)}
.nap .sp{flex:1}
.now .dzwrap{margin-top:10px;font-size:.85rem}
.now .dzwrap .dz button{background:var(--surface)}
@media (prefers-reduced-motion:no-preference){.seg{transition:width .3s}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <h1>ねむり帳</h1>
    <div class="acct"><small id="storeNote"><span class="sync-dot"></span>確認中…</small><button class="btn small" id="authBtn">Googleでログイン</button></div>
  </header>

  <section id="now" class="now awake" aria-live="polite"></section>

  <section class="period" aria-label="期間">
    <div class="chips" id="chips"></div>
    <div class="custom" id="customBox" hidden>
      <input type="date" id="fromDate" aria-label="開始日"> 〜 <input type="date" id="toDate" aria-label="終了日">
    </div>
    <div class="range num" id="rangeText"></div>
  </section>

  <section>
    <div class="stats" id="stats"></div>
    <div class="goal" style="margin-top:8px"><label for="goal">1日の目標睡眠</label><input id="goal" type="number" min="1" max="14" step="0.5" value="7"><span>時間</span></div>
  </section>

  <section class="diary" aria-label="睡眠日誌">
    <h2>睡眠日誌</h2>
    <div class="legend"><span><i style="background:var(--sleep)"></i>睡眠</span><span><i style="background:var(--nap)"></i>仮眠</span><span><i style="background:var(--wake)"></i>活動</span></div>
    <div id="diary"></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="listhead">
      <h2>記録</h2>
      <div class="row2"><button class="btn small" id="csvBtn" hidden>CSVで保存</button><button class="btn small primary" id="addBtn">＋ 記録を追加</button></div>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>

<div class="overlay" id="modal" hidden>
  <form class="sheet" id="form" autocomplete="off">
    <h2 id="formTitle">記録を追加</h2>
    <label class="field">寝た時刻<input type="datetime-local" id="fStart" required></label>
    <label class="field">起きた時刻<input type="datetime-local" id="fEnd"></label>
    <label class="check"><input type="checkbox" id="fLive"> まだ寝ている（起きた時刻は後で）</label>
    <div class="row2" id="quickDur" aria-label="睡眠時間から起床時刻を入れる"></div>
    <div class="preview" id="fPreview"></div>
    <label class="field">種類<select id="fKind"><option value="main">本睡眠</option><option value="nap">仮眠</option></select></label>
    <div class="field">睡眠の質<span class="stars" id="fStars"></span></div>
    <div class="field" id="fDzBox">起きたあとの活動中の眠気（10 = めっちゃ眠い）<div class="dz" id="fDz"></div></div>
    <label class="field">メモ<textarea id="fNote" placeholder="寝る前にスマホ、途中で起きた など"></textarea></label>
    <div class="err" id="fErr" hidden></div>
    <div class="acts">
      <button type="button" class="btn danger" id="fDelete" hidden>削除</button>
      <span style="flex:1"></span>
      <button type="button" class="btn ghost" id="fCancel">キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(() => {
const H = 3600e3, DAY = 24*H, MIN = 60e3;
const WD = ["日","月","火","水","木","金","土"];
const $ = id => document.getElementById(id);
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- formatting ---------- */
const pad = n => String(n).padStart(2,"0");
const hm = t => { const d=new Date(t); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const md = t => { const d=new Date(t); return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")"; };
function dur(ms, short){
  if (ms==null || !isFinite(ms)) return "—";
  const neg = ms<0; ms=Math.abs(ms);
  const m = Math.round(ms/MIN), h = Math.floor(m/60), mm = m%60;
  const s = short ? (h+"h"+pad(mm)+"m") : (h? h+"時間"+(mm? mm+"分":"") : mm+"分");
  return (neg?"−":"")+s;
}
const hours1 = ms => (ms/H).toFixed(1);
const toLocalInput = t => { const d=new Date(t); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); };
const toDateInput = t => { const d=new Date(t); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const fromInput = s => s ? new Date(s).getTime() : null;
const startOfDay = t => { const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const addDays = (t,n) => { const d=new Date(t); d.setDate(d.getDate()+n); return d.getTime(); };
const overlap = (a1,a2,b1,b2) => Math.max(0, Math.min(a2,b2)-Math.max(a1,b1));
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// drowsiness 1 (clear) → 10 (very sleepy): hue slides from teal to red
const dzColor = n => `hsl(${Math.round(175 - (n-1)*(170/9))} 55% 45%)`;
function dzButtons(cur, attr){
  let h = "";
  for (let n=1;n<=10;n++) h += `<button type="button" ${attr}="${n}" class="${cur===n?"on":""}" style="--dz:${dzColor(n)}" aria-label="眠気 ${n}" aria-pressed="${cur===n}">${n}</button>`;
  return h + `<div class="ends"><span>1 すっきり</span><span>10 めっちゃ眠い</span></div>`;
}

/* ---------- storage: this device (localStorage) + Google login sync (Firebase, same project as the other apps) ---------- */
const FB_CONFIG={apiKey:"AIzaSyCjVXOMhuDPB0U-p2_FG3sraPjFvP_AQVU",authDomain:"tokyo-75556.firebaseapp.com",projectId:"tokyo-75556",storageBucket:"tokyo-75556.firebasestorage.app",messagingSenderId:"143590278758",appId:"1:143590278758:web:3086b0b046376283b3cfa7"};
const FB_COLLECTION="nemuriLog";
const LS="nemuri-log-v1";
let records = [];   // {id,start,end|null,kind:"main"|"nap",quality,drowsy,note}
let ready = false, updatedAt = 0, fbUser=null, fbDb=null, unsub=null, pushT=null;
function setSync(msg,state){ $("storeNote").innerHTML = `<span class="sync-dot ${state||""}"></span>`; $("storeNote").append(document.createTextNode(msg)); }
const stamp=t=>{ if(!t) return ""; const d=new Date(t); return (d.getMonth()+1)+"/"+d.getDate()+" "+pad(d.getHours())+":"+pad(d.getMinutes()); };
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify({records, updatedAt})); }catch(e){} }
function lsLoad(){ try{ const o=JSON.parse(localStorage.getItem(LS)||"null"); if(o&&Array.isArray(o.records)){ records=o.records; updatedAt=o.updatedAt||0; } }catch(e){} }
function push(now){
  if(!fbUser||!fbDb){ setSync("この端末に保存（ログインすると全端末で同期）"); return; }
  setSync("同期中…","on"); clearTimeout(pushT);
  pushT=setTimeout(()=>{ fbDb.collection(FB_COLLECTION).doc(fbUser.uid).set({dataJson:JSON.stringify({records,updatedAt}), updatedAt})
    .then(()=>setSync("同期しました（"+stamp(updatedAt)+"）","on")).catch(e=>setSync("保存エラー（"+(e&&e.code||"")+"）","err")); }, now?0:600);
}
function touch(){ updatedAt=Date.now(); lsSave(); push(); renderAll(); }
function startSync(){
  if(unsub) unsub();
  unsub=fbDb.collection(FB_COLLECTION).doc(fbUser.uid).onSnapshot(snap=>{
    if(!snap.exists){ push(true); return; }
    if(snap.metadata.hasPendingWrites) return;
    let remote=null; try{ remote=JSON.parse((snap.data()||{}).dataJson); }catch(e){}
    if(!remote) return;
    if((remote.updatedAt||0)>updatedAt){ records=remote.records||[]; updatedAt=remote.updatedAt; lsSave(); renderAll(); setSync("最新に同期しました（"+stamp(updatedAt)+"）","on"); }
    else if((remote.updatedAt||0)<updatedAt) push(true);
    else setSync("同期済み（"+stamp(updatedAt)+"）","on");
  }, e=>setSync("同期エラー（"+(e&&e.code||"")+"）","err"));
}
function initFirebase(){
  if(typeof firebase==="undefined"){ setSync("同期ライブラリを読み込めませんでした。この端末に保存します","err"); $("authBtn").hidden=true; return; }
  try{
    firebase.initializeApp(FB_CONFIG); fbDb=firebase.firestore();
    firebase.auth().onAuthStateChanged(u=>{ fbUser=u; $("authBtn").textContent=u?"ログアウト":"Googleでログイン";
      if(u){ setSync("ログイン中："+(u.email||u.displayName||""),"on"); startSync(); }
      else { if(unsub){unsub();unsub=null;} setSync("未ログイン（この端末だけに保存）"); } });
    firebase.auth().getRedirectResult().catch(()=>{});
  }catch(e){ setSync("同期の初期化に失敗しました。この端末に保存します","err"); }
}
$("authBtn").addEventListener("click",()=>{
  if(typeof firebase==="undefined"||!firebase.auth) return;
  if(fbUser){ firebase.auth().signOut(); return; }
  const provider=new firebase.auth.GoogleAuthProvider(); setSync("ログイン処理中…");
  firebase.auth().signInWithPopup(provider).catch(err=>{ const c=err&&err.code||"";
    if(["auth/popup-blocked","auth/cancelled-popup-request","auth/operation-not-supported-in-this-environment","auth/popup-closed-by-user"].includes(c)) firebase.auth().signInWithRedirect(provider);
    else setSync("ログインできませんでした（"+c+"）","err"); });
});
const store = {
  init(){ lsLoad(); ready=true; renderAll(); initFirebase(); },
  async put(rec){
    const body = {start:rec.start, end:rec.end??null, kind:rec.kind||"main", quality:rec.quality||0, drowsy:rec.drowsy||0, note:rec.note||""};
    const id = rec.id || ("r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    const i = records.findIndex(r=>r.id===id);
    if (i>=0) records[i]={id,...body}; else records.push({id,...body});
    touch(); return id;
  },
  async remove(id){ records = records.filter(r=>r.id!==id); touch(); }
};
async function save(rec){ try{ return await store.put(rec); }catch(e){ $("storeNote").textContent="保存できませんでした。もう一度お試しください。"; } }

/* ---------- derived ---------- */
const sorted = () => records.slice().sort((a,b)=>a.start-b.start);
const endOf = r => r.end ?? Date.now();
/* Activity = from the end of a main sleep until the next main sleep starts (or now).
   Naps that start inside that window belong to that activity. */
function structure(){
  const s = sorted(), now = Date.now();
  const mains = s.filter(r=>r.kind!=="nap"), naps = s.filter(r=>r.kind==="nap");
  const used = new Set();
  const out = mains.map((r,i) => {
    const next = mains[i+1];
    if (r.end==null) return {...r, act:null, naps:[]};
    const a0 = r.end, a1 = next ? next.start : now, live = !next;
    const inside = naps.filter(n => n.start>=a0 && n.start<a1);
    inside.forEach(n=>used.add(n.id));
    const napMs = inside.reduce((t,n)=>t+(endOf(n)-n.start),0);
    return {...r, act:a1-a0, actLive:live, a0, a1, naps:inside, napMs, awake:a1-a0-napMs};
  });
  return {mains:out, orphans:naps.filter(n=>!used.has(n.id))};
}
function current(){
  const s = sorted();
  const liveMain = s.filter(r=>r.end==null && r.kind!=="nap").pop();
  const liveNap = s.filter(r=>r.end==null && r.kind==="nap").pop();
  const lastMain = s.filter(r=>r.kind!=="nap" && r.end!=null).pop();
  return {liveMain, liveNap, lastMain};
}

/* ---------- period ---------- */
const PRESETS = [["7","7日"],["14","14日"],["30","30日"],["month","今月"],["lastmonth","先月"],["custom","期間指定"]];
let period = ls.get("nemuri.period", {mode:"7"});
function range(){
  const today = startOfDay(Date.now()), tomorrow = addDays(today,1);
  const m = period.mode;
  if (/^\d+$/.test(m)) return [addDays(tomorrow,-Number(m)), tomorrow];
  const d = new Date(today);
  if (m==="month") return [new Date(d.getFullYear(), d.getMonth(), 1).getTime(), new Date(d.getFullYear(), d.getMonth()+1, 1).getTime()];
  if (m==="lastmonth") return [new Date(d.getFullYear(), d.getMonth()-1, 1).getTime(), new Date(d.getFullYear(), d.getMonth(), 1).getTime()];
  const f = period.from ? startOfDay(new Date(period.from+"T00:00").getTime()) : addDays(tomorrow,-7);
  let t = period.to ? addDays(startOfDay(new Date(period.to+"T00:00").getTime()),1) : tomorrow;
  if (t<=f) t = addDays(f,1);
  return [f,t];
}
function renderChips(){
  $("chips").innerHTML = PRESETS.map(([k,l]) => `<button class="chip" data-p="${k}" aria-pressed="${period.mode===k}">${l}</button>`).join("");
  $("customBox").hidden = period.mode!=="custom";
  if (period.mode==="custom"){ const [f,t]=range(); $("fromDate").value = toDateInput(f); $("toDate").value = toDateInput(addDays(t,-1)); }
}
$("chips").addEventListener("click", e => {
  const b = e.target.closest("[data-p]"); if(!b) return;
  if (b.dataset.p==="custom" && period.mode!=="custom"){ const [f,t]=range(); period={mode:"custom", from:toDateInput(f), to:toDateInput(addDays(t,-1))}; }
  else period = {...period, mode:b.dataset.p};
  ls.set("nemuri.period", period); renderAll();
});
["fromDate","toDate"].forEach(id => $(id).addEventListener("change", () => {
  period = {mode:"custom", from:$("fromDate").value, to:$("toDate").value}; ls.set("nemuri.period", period); renderAll();
}));

/* ---------- now card ---------- */
let justWoke = null, busy = false;
function renderNow(){
  const el = $("now");
  if (!ready){ el.className="now awake"; el.innerHTML = `<div><div class="lab">いま</div><div class="big">…</div></div>`; return; }
  const now = Date.now(), {liveMain, liveNap, lastMain} = current();
  if (liveMain || liveNap){
    const r = liveMain || liveNap;
    el.className = "now asleep";
    el.innerHTML = `<div><div class="lab">${liveMain?"就寝中":"仮眠中"}</div><div class="big">${dur(now-r.start,true)}</div><div class="sub num">${md(r.start)} ${hm(r.start)} から</div></div>
      <div class="acts"><button class="btn primary" data-act="wake" data-id="${r.id}">起きた</button><button class="btn ghost" style="color:inherit;border-color:rgba(255,255,255,.4)" data-act="edit" data-id="${r.id}">修正</button></div>`;
    return;
  }
  el.className = "now awake";
  let rate = "";
  const jw = justWoke && records.find(x=>x.id===justWoke);
  if (jw && jw.kind!=="nap") rate = `<div class="rate">よく眠れた？ <span class="stars">${[1,2,3,4,5].map(n=>`<button type="button" data-q="${n}" class="${(jw.quality||0)>=n?"on":""}" aria-label="${n}">★</button>`).join("")}</span></div>`;
  if (!lastMain){
    el.innerHTML = `<div><div class="lab">はじめに</div><div class="big" style="font-family:var(--f-display);font-size:1.3rem">寝るときにボタンを押すだけ</div><div class="sub">前の分は「＋ 記録を追加」から入れられます</div></div>
       <div class="acts"><button class="btn primary" data-act="sleep">今から寝る</button></div>`;
    return;
  }
  const st = structure().mains.find(m=>m.id===lastMain.id);
  const napTxt = st && st.naps.length ? ` ・ 仮眠 ${st.naps.length}回 ${dur(st.napMs)}` : "";
  el.innerHTML = `<div style="min-width:0;flex:1 1 260px"><div class="lab">活動中（起きてから）</div><div class="big">${dur(now-lastMain.end,true)}</div>
      <div class="sub num">${md(lastMain.end)} ${hm(lastMain.end)} 起床 ・ 睡眠 ${dur(lastMain.end-lastMain.start)}${napTxt}</div>${rate}
      <div class="dzwrap"><div style="margin-bottom:4px">いまの活動の眠気</div><div class="dz" data-dzfor="${lastMain.id}">${dzButtons(lastMain.drowsy||0,"data-dz")}</div></div></div>
    <div class="acts"><button class="btn" data-act="nap">仮眠する</button><button class="btn primary" data-act="sleep">今から寝る</button></div>`;
}
$("now").addEventListener("click", async e => {
  if (busy) return;
  const q = e.target.closest("[data-q]");
  if (q){ const r = records.find(x=>x.id===justWoke); if(r){ busy=true; await save({...r, quality:Number(q.dataset.q)}); busy=false; } return; }
  const dz = e.target.closest("[data-dz]");
  if (dz){ const r = records.find(x=>x.id===dz.closest("[data-dzfor]").dataset.dzfor); if(r){ busy=true; await save({...r, drowsy:Number(dz.dataset.dz)}); busy=false; } return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act; busy = true;
  if (act==="sleep"){ justWoke=null; await save({start:Date.now(), end:null, kind:"main"}); }
  if (act==="nap"){ await save({start:Date.now(), end:null, kind:"nap"}); }
  if (act==="wake"){ const r = records.find(x=>x.id===b.dataset.id); if(r){ if(r.kind!=="nap") justWoke=r.id; await save({...r, end:Date.now()}); } }
  if (act==="edit"){ openForm(records.find(r=>r.id===b.dataset.id)); }
  busy = false;
});

/* ---------- stats ---------- */
function renderStats(){
  const [f,t] = range(), now = Date.now(), tEff = Math.min(t, now);
  $("rangeText").textContent = `${md(f)} 〜 ${md(addDays(t,-1))}`;
  const {mains, orphans} = structure();
  let sleep=0, nap=0, awake=0, count=0;
  const bed=[], wake=[], dzs=[];
  mains.forEach(r => {
    sleep += overlap(r.start, endOf(r), f, tEff);
    if (r.start>=f && r.start<t){ count++; bed.push(r.start); if(r.end!=null) wake.push(r.end); }
    if (r.act!=null){
      const span = overlap(r.a0, r.a1, f, tEff);
      const napIn = r.naps.reduce((s,n)=>s+overlap(n.start, endOf(n), f, tEff),0);
      awake += span - napIn;
      if (r.drowsy && span>0) dzs.push(r.drowsy);
    }
  });
  records.filter(r=>r.kind==="nap").forEach(n => nap += overlap(n.start, endOf(n), f, tEff));
  const total = sleep+nap;
  const days = Math.max((tEff - f)/DAY, 1/24);
  const perDay = total/days, diff = perDay - goal*H, debt = goal*H*days - total;
  const clock = arr => {
    if (!arr.length) return "—";
    let x=0,y=0; arr.forEach(t=>{ const d=new Date(t); const a=(d.getHours()*60+d.getMinutes())/1440*2*Math.PI; x+=Math.cos(a); y+=Math.sin(a); });
    const m = Math.round(((Math.atan2(y,x)/(2*Math.PI)+1)%1)*1440); return pad(Math.floor(m/60)%24)+":"+pad(m%60);
  };
  const dzAvg = dzs.length ? dzs.reduce((a,b)=>a+b,0)/dzs.length : null;
  const cards = [
    ["key","合計睡眠", `${hours1(total)}<small>時間</small>`, `${dur(total)}${nap?` ・うち仮眠 ${dur(nap)}`:""}`],
    ["","合計活動", `${hours1(awake)}<small>時間</small>`, `起きていた時間（仮眠を除く）`],
    ["","1日あたり睡眠", `${dur(perDay,true)}`, `目標比 <span class="${diff>=0?"pos":"neg"}">${diff>=0?"+":""}${dur(diff,true)}</span>`],
    ["","睡眠負債", debt>0?`${hours1(debt)}<small>時間</small>`:`0<small>時間</small>`, debt>0?`目標まであと ${dur(debt)}`:`目標を ${dur(-debt)} 上回り`],
    ["","平均の眠気", dzAvg==null?"—":`<span style="color:${dzColor(Math.round(dzAvg))}">${dzAvg.toFixed(1)}</span><small>/10</small>`, dzs.length?`${dzs.length}回の活動から`:"活動ごとに記録できます"],
    ["","平均 就寝 / 起床", `${clock(bed)}<small>/</small>${clock(wake)}`, count?`本睡眠 ${count}回`:"この期間の記録なし"],
  ];
  $("stats").innerHTML = cards.map(([c,k,v,d]) => `<div class="stat ${c}"><span class="k">${k}</span><span class="v">${v}</span><span class="d">${d}</span></div>`).join("");
}

/* ---------- diary (24h rows) ---------- */
function renderDiary(){
  const [f,t] = range(), now = Date.now();
  const s = sorted();
  const totalDays = Math.round((t-f)/DAY), show = Math.min(totalDays, 31), first = addDays(t, -show);
  let html = "";
  for (let i=show-1;i>=0;i--){
    const d0 = addDays(first,i), d1 = addDays(d0,1), future = d0 > now;
    let segs="", tot=0;
    s.forEach(r => {
      const e = endOf(r), o = overlap(r.start,e,d0,d1);
      if (!o) return; tot+=o;
      const left = (Math.max(r.start,d0)-d0)/(d1-d0)*100, w = o/(d1-d0)*100;
      segs += `<div class="seg ${r.kind==="nap"?"nap":""} ${r.end==null?"live":""}" style="left:${left}%;width:${Math.max(w,.4)}%" title="${r.kind==="nap"?"仮眠 ":""}${hm(r.start)}–${r.end==null?"記録中":hm(r.end)}"></div>`;
    });
    if (!future && d1>now){ const l=(now-d0)/(d1-d0)*100; segs += `<div class="seg" style="left:${l}%;width:${100-l}%;background:var(--surface)"></div>`; }
    const wd = new Date(d0).getDay();
    html += `<div class="drow"><span class="dl ${wd===0||wd===6?"we":""}">${md(d0)}</span><div class="track ${future?"future":""}">${segs}</div><span class="dt">${future?"":tot?dur(tot,true):"—"}</span></div>`;
  }
  html += `<div class="axis"><span></span><div class="ticks"><span style="left:0">0</span><span style="left:25%">6</span><span style="left:50%">12</span><span style="left:75%">18</span><span style="left:100%">24時</span></div><span></span></div>`;
  if (totalDays>show) html += `<div class="more">表示は直近31日分。合計は期間全体（${totalDays}日）で計算しています。</div>`;
  $("diary").innerHTML = html;
}

/* ---------- list ---------- */
let armed = null;
function delBtn(id){ return `<button class="btn small danger ${armed===id?"armed":""}" data-del="${id}">${armed===id?"本当に削除":"削除"}</button>`; }
function napRow(n){
  const live = n.end==null;
  return `<div class="nap"><span>仮眠</span><span class="t">${hm(n.start)}–${live?"記録中":hm(n.end)}</span><b class="num">${dur(endOf(n)-n.start)}</b>${n.note?`<span>${esc(n.note)}</span>`:""}<span class="sp"></span>
    <button class="btn small" data-edit="${n.id}">編集</button>${delBtn(n.id)}</div>`;
}
function renderList(){
  const [f,t] = range();
  $("csvBtn").hidden = !records.length;
  if (!ready){ $("list").innerHTML = `<div class="empty">読み込み中…</div>`; return; }
  if (!records.length){
    $("list").innerHTML = `<div class="empty"><div>まだ記録がありません。</div><div style="font-size:.85rem">寝るときに上の「今から寝る」、起きたら「起きた」。<br>前の分は「＋ 記録を追加」で入れられます。</div></div>`; return;
  }
  const {mains, orphans} = structure();
  const items = [
    ...mains.filter(r => overlap(r.start, r.a1 ?? endOf(r), f, t) > 0).map(r=>({type:"main", r, at:r.start})),
    ...orphans.filter(n => overlap(n.start, endOf(n), f, t) > 0).map(n=>({type:"nap", r:n, at:n.start}))
  ].sort((a,b)=>b.at-a.at);
  if (!items.length){ $("list").innerHTML = `<div class="empty">この期間の記録はありません。</div>`; return; }
  $("list").innerHTML = items.map(({type, r}) => {
    if (type==="nap") return `<article class="rec"><div class="when"><b>${md(r.start)}</b> <span class="tag nap">仮眠</span></div><div></div><div class="naps" style="grid-column:1/-1">${napRow(r)}</div></article>`;
    const live = r.end==null;
    const sl = endOf(r)-r.start;
    const q = r.quality ? `<span>質 <span style="color:var(--accent)">${"★".repeat(r.quality)}</span><span style="color:var(--line)">${"★".repeat(5-r.quality)}</span></span>` : "";
    const sameDay = !live && startOfDay(r.start)===startOfDay(r.end);
    let actBlk = "";
    if (r.act!=null){
      const overlapWarn = r.act<0 ? `<span class="warn">次の睡眠と ${dur(-r.act)} 重なっています</span>` : "";
      actBlk = `<div class="actblk">
        <div class="ah"><span>その後の活動 <b class="num">${dur(r.act)}</b>${r.actLive?"（継続中）":` → ${hm(r.a1)}`}</span>
          ${r.naps.length?`<span>仮眠 ${r.naps.length}回 <b class="num">${dur(r.napMs)}</b> ・ 起きていた時間 <b class="num">${dur(r.awake)}</b></span>`:""}${overlapWarn}</div>
        <div class="dz" data-dzfor="${r.id}"><span style="font-size:.8rem;color:var(--muted);margin-right:4px">眠気</span>${dzButtons(r.drowsy||0,"data-dz")}</div>
        ${r.naps.length?`<div class="naps">${r.naps.map(napRow).join("")}</div>`:""}
        <div><button class="btn small" data-addnap="${r.id}">＋ 仮眠を追加</button></div>
      </div>`;
    }
    return `<article class="rec">
      <div class="when"><b>${md(r.start)}</b> ${hm(r.start)} → ${live?"就寝中":(sameDay?"":md(r.end)+" ")+hm(r.end)}${live?' <span class="tag live">記録中</span>':""}</div>
      <div class="ops"><button class="btn small" data-edit="${r.id}">編集</button>${delBtn(r.id)}</div>
      <div class="meta"><span>睡眠 <b class="sl num">${dur(sl)}</b></span>${q}</div>
      ${r.note?`<div class="note">${esc(r.note)}</div>`:""}
      ${actBlk}
    </article>`;
  }).join("");
}
$("list").addEventListener("click", async e => {
  const ed = e.target.closest("[data-edit]"); if (ed){ openForm(records.find(r=>r.id===ed.dataset.edit)); return; }
  const an = e.target.closest("[data-addnap]");
  if (an){ const m = structure().mains.find(x=>x.id===an.dataset.addnap); if(m) openForm(null, m); return; }
  const dz = e.target.closest("[data-dz]");
  if (dz){ const r = records.find(x=>x.id===dz.closest("[data-dzfor]").dataset.dzfor); if(r && !busy){ busy=true; await save({...r, drowsy:Number(dz.dataset.dz)===r.drowsy?0:Number(dz.dataset.dz)}); busy=false; } return; }
  const de = e.target.closest("[data-del]");
  if (de){
    const id = de.dataset.del;
    if (armed!==id){ armed=id; renderList(); setTimeout(()=>{ if(armed===id){armed=null; renderList();} }, 4000); return; }
    armed=null; de.disabled=true; try{ await store.remove(id); }catch(err){ $("storeNote").textContent="削除できませんでした。"; }
  }
});

let editing = null, fQuality = 0, fDrowsy = 0;
function renderStars(){
  $("fStars").innerHTML = [1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" class="${fQuality>=n?"on":""}" aria-label="質 ${n}">★</button>`).join("") +

function renderFDz(){ $("fDz").innerHTML = dzButtons(fDrowsy, "data-fdz"); }
$("fStars").addEventListener("click", e => { const b=e.target.closest("[data-n]"); if(b){ fQuality=Number(b.dataset.n); renderStars(); }});
$("fDz").addEventListener("click", e => { const b=e.target.closest("[data-fdz]"); if(b){ const n=Number(b.dataset.fdz); fDrowsy = fDrowsy===n?0:n; renderFDz(); }});
function setQuick(){
  const nap = $("fKind").value==="nap";
  const opts = nap ? [[15,"15分"],[20,"20分"],[30,"30分"],[45,"45分"],[60,"1時間"],[90,"1時間半"]] : [[240,"4時間"],[300,"5時間"],[360,"6時間"],[420,"7時間"],[480,"8時間"],[540,"9時間"]];
  $("quickDur").innerHTML = opts.map(([m,l])=>`<button type="button" class="btn small" data-m="${m}">${l}寝た</button>`).join("");
  $("fDzBox").hidden = nap;
  document.querySelector('#fStars').closest('.field').hidden = nap;
}
$("fKind").addEventListener("change", ()=>{ setQuick(); preview(); });
$("quickDur").addEventListener("click", e => {
  const b=e.target.closest("[data-m]"); if(!b) return;
  const s=fromInput($("fStart").value); if(s==null) return;
  $("fLive").checked=false; $("fEnd").disabled=false; $("fEnd").value = toLocalInput(s+Number(b.dataset.m)*MIN); preview();
});
function preview(){
  const s=fromInput($("fStart").value), en=$("fLive").checked?null:fromInput($("fEnd").value);
  const nap = $("fKind").value==="nap";
  let txt="", err="";
  if (s!=null && en!=null){ const d=en-s; txt = `${nap?"仮眠":"睡眠"} ${dur(d)}`; if(d<=0) err="起きた時刻は寝た時刻より後にしてください。"; else if(d>20*H) err="20時間を超えています。日付を確認してください。"; }
  else if (s!=null && $("fLive").checked) txt = `${nap?"仮眠中":"就寝中"}として記録（${dur(Date.now()-s)} 経過）`;
  else txt = "寝た時刻と起きた時刻を入れてください";
  $("fPreview").textContent = txt;
  $("fErr").hidden = !err; $("fErr").textContent = err;
  return !err;
}
["fStart","fEnd"].forEach(id=>$(id).addEventListener("input",preview));
$("fLive").addEventListener("change", ()=>{ $("fEnd").disabled=$("fLive").checked; preview(); });
function openForm(rec, napFor){
  editing = rec || null;
  const now = Date.now();
  let defS, defE, kind = rec?.kind || "main";
  if (rec){ defS = rec.start; defE = rec.end; }
  else if (napFor){ kind="nap"; const end = Math.min(napFor.a1, now); defS = Math.max(napFor.a0, end - 90*MIN); defE = defS + 30*MIN; }
  else { defS = addDays(startOfDay(now),-1)+23*H; defE = startOfDay(now)+7*H; }
  $("formTitle").textContent = rec ? (kind==="nap"?"仮眠を編集":"記録を編集") : (napFor ? "仮眠を追加" : "記録を追加");
  $("fStart").value = toLocalInput(defS);
  $("fLive").checked = rec ? rec.end==null : false;
  $("fEnd").disabled = $("fLive").checked;
  $("fEnd").value = defE!=null ? toLocalInput(Math.min(defE, now)) : "";
  $("fKind").value = kind;
  $("fNote").value = rec?.note || "";
  fQuality = rec?.quality || 0; fDrowsy = rec?.drowsy || 0; renderStars(); renderFDz(); setQuick();
  $("fDelete").hidden = !rec; $("fDelete").classList.remove("armed"); $("fDelete").textContent="削除";
  preview();
  $("modal").hidden = false; $("fStart").focus();
}
function closeForm(){ $("modal").hidden = true; editing=null; }
$("addBtn").addEventListener("click", ()=>openForm(null));
$("fCancel").addEventListener("click", closeForm);
$("modal").addEventListener("click", e=>{ if(e.target===$("modal")) closeForm(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("modal").hidden) closeForm(); });
$("fDelete").addEventListener("click", async ()=>{
  const b=$("fDelete");
  if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="本当に削除"; return; }
  const id=editing.id; closeForm(); try{ await store.remove(id); }catch(e){ $("storeNote").textContent="削除できませんでした。"; }
});
$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const s=fromInput($("fStart").value), live=$("fLive").checked, en=live?null:fromInput($("fEnd").value);
  const kind = $("fKind").value;
  const showErr = m => { $("fErr").hidden=false; $("fErr").textContent=m; };
  if (s==null || (!live && en==null)) return showErr("寝た時刻と起きた時刻を入れてください。");
  if (!preview()) return;
  if (live && records.some(r=>r.end==null && r.id!==editing?.id)) return showErr("すでに記録中の睡眠があります。先に起きた時刻を入れてください。");
  const rec = {id:editing?.id, start:s, end:en, kind, quality:kind==="nap"?0:fQuality, drowsy:kind==="nap"?0:fDrowsy, note:$("fNote").value.trim()};
  closeForm(); await save(rec);
});

/* ---------- CSV ---------- */

$("csvBtn").addEventListener("click", async ()=>{
  const rows = [["種類","寝た時刻","起きた時刻","睡眠(分)","その後の活動(分)","うち仮眠(分)","活動中の眠気(1-10)","睡眠の質(1-5)","メモ"]];
  const f = t => toLocalInput(t).replace("T"," ");
  const {mains, orphans} = structure();
  mains.forEach(r => {
    rows.push(["本睡眠", f(r.start), r.end?f(r.end):"", r.end?Math.round((r.end-r.start)/MIN):"", r.act!=null&&!r.actLive?Math.round(r.act/MIN):"", r.naps.length?Math.round(r.napMs/MIN):"", r.drowsy||"", r.quality||"", r.note||""]);
    r.naps.forEach(n => rows.push(["仮眠", f(n.start), n.end?f(n.end):"", n.end?Math.round((n.end-n.start)/MIN):"", "", "", "", "", n.note||""]));
  });
  orphans.forEach(n => rows.push(["仮眠", f(n.start), n.end?f(n.end):"", n.end?Math.round((n.end-n.start)/MIN):"", "", "", "", "", n.note||""]));
  const csv = "﻿"+rows.map(r=>r.map(v=>{ v=String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(",")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=`nemuri_${toDateInput(Date.now())}.csv`; document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
});

/* ---------- boot ---------- */
function renderAll(){ renderChips(); renderNow(); renderStats(); renderDiary(); renderList(); }
renderAll();
store.init();
setInterval(()=>{ if(ready && $("modal").hidden && !armed){ renderNow(); renderStats(); renderDiary(); renderList(); } }, 30000);
})();
</script>
