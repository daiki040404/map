<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* スマホでは全体の大きさ（k=1で標準） */(function(){try{var sw=Math.min(screen.width,screen.height);if(sw&&sw<600){var k=1.3,w=Math.round(sw/k),m=document.querySelector('meta[name=viewport]');m.setAttribute("content","width="+w+",initial-scale="+k+",maximum-scale="+k+",viewport-fit=cover")}}catch(e){}})();</script>
<title>筋トレログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 1カラムのスマホ操作盤。上に週ストリップ → 選択日の中身 → 種目パレット → ルールのチェック結果 */
:root{
  --bg:#eceff2; --panel:#ffffff; --panel2:#f5f7f9; --line:#d6dce2;
  --fg:#16202a; --muted:#5d6b78; --accent:#d4561c; --accent-ink:#ffffff;
  --ok:#2f8a57; --ok-bg:#e3f3ea; --warn:#b07a00; --warn-bg:#fbf1d6; --bad:#c8322a; --bad-bg:#fbe4e2;
  --sel:#16202a; --sel-ink:#ffffff;
  --f-num:"Barlow Condensed","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161b; --panel:#1a2128; --panel2:#212a32; --line:#2e3943;
  --fg:#e7ecf0; --muted:#94a3b0; --accent:#f07a3c; --accent-ink:#1a1209;
  --ok:#5cc489; --ok-bg:#16301f; --warn:#e2b23c; --warn-bg:#33290f; --bad:#ff7a70; --bad-bg:#3a1a18;
  --sel:#e7ecf0; --sel-ink:#11161b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --panel:#1a2128; --panel2:#212a32; --line:#2e3943;
  --fg:#e7ecf0; --muted:#94a3b0; --accent:#f07a3c; --accent-ink:#1a1209;
  --ok:#5cc489; --ok-bg:#16301f; --warn:#e2b23c; --warn-bg:#33290f; --bad:#ff7a70; --bad-bg:#3a1a18;
  --sel:#e7ecf0; --sel-ink:#11161b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:14px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.tabpage{display:flex;flex-direction:column;gap:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:800;display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0;border-radius:10px}
.tabbar button .ti{font-size:18px;line-height:1}
.tabbar button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.timer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.timer .tset{display:inline-flex;align-items:center;gap:4px}
.timer input{font:inherit;font-size:16px;font-family:var(--f-num);font-weight:700;width:4.2em;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:5px 6px;text-align:right}
.timer .tleft{font-family:var(--f-num);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.tpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:850;display:flex;align-items:center;gap:8px;background:var(--sel);color:var(--sel-ink);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tpill span,.tpill button{white-space:nowrap}
.tctl{display:inline-flex;gap:6px;margin-left:auto}
.ticon{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:17px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ticon.play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tpill .ticon{width:34px;height:34px;font-size:15px;border:0;background:rgba(127,127,127,.25);color:inherit}
.tleft.paused{color:var(--muted)}
.tpill span{font-family:var(--f-num);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tpill button{border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;background:rgba(127,127,127,.25);color:inherit}
.tpill.done{background:var(--ok);color:#fff;animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.tpill.done{animation:none}}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
.dcard.open{cursor:default}
.dcard .dh{cursor:default}
.dcard .dh .chev{font-size:13px;opacity:.85}
.dedit{padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.dedit .prevline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.dedit .prevline b{color:var(--fg);font-weight:600}
.dedit textarea.xmemo{resize:none;overflow:hidden;line-height:1.4;display:block;min-height:0;border:0;border-bottom:1px dashed var(--line);border-radius:0;background:transparent;padding:2px 4px;font-size:16px}
.wmline.xmline{padding-left:0;align-items:flex-start;margin-top:2px}.wmline.xmline .ml{padding-top:5px}
.recf{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.recf .viewsw{margin-bottom:0;align-self:flex-start}
.recf .viewsw button{padding:6px 12px}
.recsel{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.recsel select,.recsel input,.recex select{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:8px;padding:5px 8px}
.recbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.recs{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.rph{border-top:2px solid var(--line);padding-top:10px;margin-top:4px;display:flex;flex-direction:column;gap:4px}
.rph .rt{font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.04em}
.rph .rm{font-size:13px;white-space:pre-wrap;background:var(--panel2);border-radius:8px;padding:6px 8px}
.rday{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:10px;display:flex;flex-direction:column;gap:6px}
.rday .rh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rday .rd{font-family:var(--f-num);font-size:18px;font-weight:700}
.rday .rw{font-size:13px;font-weight:700;color:var(--muted)}
.rday .rw.sun{color:var(--bad)} .rday .rw.sat{color:#3c74c8}
.rday .rh .mini{margin-left:auto}.rday .rh .mini.rdel{margin-left:0}
.rex{border-left:4px solid var(--c);padding-left:8px}
.rex .rn{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.rex .rs{font-family:var(--f-num);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
.rex .rs small{color:var(--muted);font-family:var(--f-body);font-size:12px}
.rex .rxm,.rday .rdm{font-size:12.5px;color:var(--muted);white-space:pre-wrap}
.rday .rdm{border-top:1px dashed var(--line);padding-top:6px;color:var(--fg)}
header.top{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.appbar{position:sticky;top:0;z-index:820;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.abin{max-width:720px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:inherit;font-size:17px;font-weight:700;letter-spacing:.03em;margin-right:4px;white-space:nowrap;border:0;background:none;color:var(--fg);padding:4px 2px;cursor:pointer}
.hleft{display:flex;align-items:center;gap:2px;min-width:0}
.hico{position:relative;width:32px;height:32px;border:0;background:none;color:var(--fg);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.hico:disabled{opacity:.28}
.hico:not(:disabled):active{background:var(--panel2)}
.hbadge{position:absolute;top:1px;right:0;min-width:15px;height:15px;border-radius:8px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;font-family:var(--f-num)}
@media (max-width:470px){.htimer .hl{display:none}.htimer{padding-left:6px;gap:4px}.ttime{font-size:20px;min-width:2.8em}.htimer .ticon{width:32px;height:32px;font-size:15px}.abin{gap:6px;padding-inline:12px}}
.trashlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.trow2{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:10px;display:flex;flex-direction:column;gap:6px}
.trow2 .th{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.trow2 .tk{font-size:11px;font-weight:700;color:#fff;background:var(--muted);border-radius:5px;padding:1px 6px}
.trow2 .tn2{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.trow2 .td{font-size:12px;color:var(--muted)}
.htimer{display:flex;align-items:center;gap:6px;border-radius:999px;padding:3px 4px 3px 12px;border:1px solid var(--line);background:var(--panel2)}
.htimer .hl{font-size:11px;font-weight:700;color:var(--muted)}
.ttime{border:0;background:none;font-family:var(--f-num);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg);padding:0 4px;min-width:3.1em;text-align:center}
.htimer.run .ttime{color:var(--accent)}
.htimer.pause .ttime{color:var(--muted)}
.htimer.done{background:var(--ok);border-color:var(--ok)}
.htimer.done .ttime,.htimer.done .hl{color:#fff}
.htimer.done{animation:hpulse 1s ease-in-out 3}
@keyframes hpulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.htimer.done{animation:none}}
.tedit2{display:inline-flex;align-items:center;gap:1px}
.tedit2 input{font:inherit;font-family:var(--f-num);font-size:20px;font-weight:700;width:1.9em;text-align:center;border:1px solid var(--accent);background:var(--panel);color:var(--fg);border-radius:6px;padding:1px 0;font-variant-numeric:tabular-nums}
.tcolon{font-family:var(--f-num);font-size:20px;font-weight:700}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em}
.sync{font-size:12px;color:var(--muted)}
.acct{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:middle}
.sync-dot.on{background:var(--ok)} .sync-dot.err{background:var(--bad)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;scroll-margin-top:calc(var(--abh,64px) + 8px)}
.label{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 週ナビ */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pinfo{text-align:center;min-width:0}
.peredit{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.peredit .t{font-weight:700;font-size:14px}
.dl{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700}
.dl input{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:5px 6px;font-family:var(--f-num)}
.days .noper{grid-column:1/-1;color:var(--muted);font-size:14px;padding:12px 4px}
.weeknav .range{font-family:var(--f-num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.navbtn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;width:40px;height:36px;font-size:18px}
.todaybtn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:0 10px;height:36px;font-size:13px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.days .wkh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:2px}
.days .wkh.sun{color:var(--bad)} .days .wkh.sat{color:#3c74c8}
.days .pad{min-height:0}
.psel{font:inherit;font-family:var(--f-num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:10px;padding:2px 22px 2px 8px;max-width:100%;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 7px) 55%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.psel:hover,.psel:focus{border-color:var(--line)}
/* 一覧のとき：日本語は英数字用フォントで出せないので、太さ・大きさ・字間を日付の見た目に寄せる */
.psel.allm{font-family:var(--f-body);font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.45;padding-top:3px;padding-bottom:3px}
.lmon{font-family:var(--f-num);font-size:15px;font-weight:700;color:var(--muted);padding:8px 2px 0}
.days .monhead{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.days .monhead .mt{font-family:var(--f-num);font-size:20px;font-weight:700}
.days .monfoot{grid-column:1/-1;margin-top:6px}
.day.out{opacity:.45}
.viewsw{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.viewsw button{border:0;background:var(--panel2);padding:6px 14px;font-size:13px;font-weight:700;color:var(--muted)}
.viewsw button.on{background:var(--sel);color:var(--sel-ink)}
.days.list{display:flex;flex-direction:column;gap:6px}
.lrow{position:relative;display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:10px;align-items:start;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 10px}
.lrow{grid-template-columns:4.2em minmax(0,1fr) auto}.lplan{align-self:center;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;color:var(--fg);white-space:nowrap}.lplan.on{border-color:var(--accent)}.lppanel{position:relative;padding-right:44px}.lppanel .lpx{position:absolute;top:8px;right:8px}.lplan .tv{font-size:9px;color:var(--muted)}
.lrow.today{border-color:var(--accent)}
.lrow.selected{border-color:var(--sel);box-shadow:inset 0 0 0 1.5px var(--sel)}
.lrow.bad{border-color:var(--bad)}
.lhead{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.ldate{font-family:var(--f-num);font-size:20px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.lrow.today .ldate{color:var(--accent)}
.ldow{font-size:12px;font-weight:700;color:var(--muted)}
.ldow.sun{color:var(--bad)} .ldow.sat{color:#3c74c8}
.lhead .dt{font-size:10px;border:1px solid currentColor;border-radius:4px;padding:0 4px;font-weight:700}
.lmemo{font-size:11px;color:var(--accent)}
.lchips{display:flex;flex-wrap:wrap;gap:4px;min-width:0;align-self:center}
.lchip{color:#fff;font-size:12.5px;font-weight:700;border-radius:6px;padding:3px 8px;line-height:1.3;overflow-wrap:anywhere}
.lchips .rest{color:var(--muted);font-size:13px}
.lrow .flag{top:6px;right:6px}
.day{min-width:0;overflow:hidden;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:6px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:84px;position:relative}
.day .dow{font-size:11px;color:var(--muted);font-weight:700}
.day .dn{font-family:var(--f-num);font-size:24px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.day.sun .dow{color:var(--bad)} .day.sat .dow{color:#3c74c8}
.day .tags{display:flex;flex-direction:column;gap:2px;width:100%;min-width:0;padding:0 3px}
.day .tag{font-size:10px;line-height:1.2;border-radius:4px;padding:1px 2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.day .rest{font-size:10px;color:var(--muted)}
.day.today{border-color:var(--accent)}
.day.today .dn{color:var(--accent)}
.day.selected{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.day.selected .dow,.day.selected .rest{color:var(--sel-ink);opacity:.8}
.day.selected .dn{color:var(--sel-ink)}
.day .flag{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:var(--f-num)}

/* 選択日 */
.daygroup{scroll-margin-top:calc(var(--abh,64px) + 8px)}
.daygroup>.panel+.panel{margin-top:14px}
.daypanel{border-top:0;border-radius:0 0 14px 14px}
.daystick{position:sticky;top:var(--abh,64px);z-index:40;background:var(--panel);padding:10px 14px 8px;border:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 6px 10px -8px rgba(0,0,0,.45)}
.dayhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.daystick .dsum{margin-top:6px;gap:4px}
.daystick .dsum div{padding:3px 2px;border-radius:8px}
.daystick .dsum small{font-size:10px;letter-spacing:0}
.daystick .dsum b{font-size:16px}
.daystick .dsum i{font-style:normal;font-size:10px;color:var(--muted);margin-left:2px;font-weight:600}
.dayhead .sharebtn{margin-left:auto;align-self:center;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:0}
.dayhead .editbtn{margin-left:auto;align-self:center}.dayhead .editbtn+.sharebtn{margin-left:6px}
.dayhead .yr{font-size:12px;color:var(--muted);font-weight:700;align-self:center}
.dayhead .dw.sun{color:var(--bad)}.dayhead .dw.sat{color:#3c74c8}
.dayhead .dht{font-size:11px;font-weight:700;border:1px solid currentColor;border-radius:5px;padding:0 5px;align-self:center}
.day.cday{min-height:62px;padding:5px 1px 4px;gap:3px;justify-content:flex-start}
.day.cday .dn{font-size:17px}
.day.cday .ctag{height:14px;display:flex;justify-content:center;max-width:100%;overflow:hidden}
.day.cday .ctag .dt{font-size:9px;padding:0 2px;line-height:12px}
.cdots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;padding:0 3px;max-width:100%}
.cdot{width:7px;height:7px;border-radius:50%}
.cmore{font-size:9px;font-weight:700;line-height:7px;color:var(--muted)}
.day.cday .ccnt{display:none}
.day.selected .cmore{color:var(--sel-ink)}
.cprev{grid-column:1/-1;margin-top:8px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cph{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cph .cpd{font-family:var(--f-num);font-size:20px;font-weight:700}
.cph .dt{font-size:10.5px;border:1px solid currentColor;border-radius:5px;padding:0 5px;font-weight:700}
.cph .cpgo{margin-left:auto}

<script>
(function(){
const COLORS=["#d4561c","#2f6fd0","#2f8a57","#8a4fc4","#c23a6b","#0f8b8d","#a87410","#5b6773"];
const DOW=["日","月","火","水","木","金","土"];
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));

// ---------- dates ----------
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(k){const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)}
function add(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function addK(k,n){return key(add(parse(k),n))}
function diff(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function monday(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x}
function md(d){return (d.getMonth()+1)+"/"+d.getDate()}
const mdk=k=>md(parse(k));
let today=new Date();today.setHours(0,0,0,0);
let todayK=key(today);
let userNavigated=false;

function defaults(){
  const c=(name,color,items)=>({id:uid(),name,color,items:items.map(n=>({id:uid(),name:n}))});
  const cats=[c("胸",COLORS[0],["ベンチ9割","ベンチ7割","ダンベルプレス"]),c("背中",COLORS[1],["デッドリフト","懸垂","ローイング"]),c("脚",COLORS[2],["スクワット","レッグプレス"]),c("肩",COLORS[3],["ショルダープレス","サイドレイズ"]),c("腕",COLORS[4],["カール","トライセプス"])];
  const it=n=>{for(const k of cats)for(const i of k.items)if(i.name===n)return "i:"+i.id};
  const rules=[{id:uid(),type:"freq",a:it("ベンチ9割"),d:7,min:1,max:1},{id:uid(),type:"freq",a:it("ベンチ7割"),d:7,min:1,max:1},{id:uid(),type:"gap",a:it("ベンチ9割"),b:it("ベンチ7割"),n:1,both:false},{id:uid(),type:"gap",a:it("デッドリフト"),b:it("ベンチ9割"),n:1,both:false}];
  const ms=key(monday(today));
  return {cats,periods:[{id:uid(),start:ms,end:addK(ms,6),rules}]};
}

// ---------- state ----------
// cats: 削除は deleted:true（過去の記録を残す）/ plan: 日付→種目id / notes: 日付→メモ
// periods: [{id,start,end,rules,memo,saved,savedAt}]
const d0=defaults();
let cats=d0.cats,plan={},notes={},periods=d0.periods;
const TAG_COLORS=["#5b6773","#a87410","#2f6fd0","#c23a6b","#2f8a57","#8a4fc4","#d4561c","#0f8b8d"];
const defaultTags=()=>[{id:"t_work",name:"仕事",color:"#5b6773"},{id:"t_ake",name:"明け",color:"#a87410"},{id:"t_off",name:"公休",color:"#2f6fd0"},{id:"t_gou",name:"合トレ",color:"#c23a6b"}];
let tags=defaultTags(),dayTags={},tagEditing=false;
// logs: 日付 → 種目id → [{w:重量,r:回数,m:メモ}] / templates: [{id,name,items:[{id:種目id,sets:セット数}]}]
let logs={},templates=[],tplEditing=null,tplConfirm=null,tplMng=false,tplOpen=false,tplSel=new Set(),exNotes={},dayMemo={},planSrc={},openEx=new Set(),closedEx=new Set(),skipLog=false;
let customUnits=[],delAsk=false,trash=[],prevTab="menu",newOpen=new Set(),allMode=false,calMonth=null,recMarks=new Set(),tab="menu",recMode="all",recYear=null,recMonth=null,recFrom="",recTo="",recDay="",recAsc=false,recMkOpen=null,memoOpen=false,catOpen=false,renOpen=false,pOpen=false,renId=null,pMenuId=null,pDelId=null,catPage=false,catY=0,recExs=new Set(),recExOpen=false,recExTop=0,recDelAsk=null;
let collapsed=(()=>{try{return new Set(JSON.parse(localStorage.getItem("kintore-collapsed")||"[]"))}catch(e){return new Set()}})();
const saveCollapsed=()=>{try{localStorage.setItem("kintore-collapsed",JSON.stringify([...collapsed]))}catch(e){}};
const liveTags=g=>tags.filter(t=>!t.deleted&&(!g||(t.group||"plan")===g));
const defaultMarks=()=>[{id:"m_good",name:"調子が良い",color:"#2f8a57",group:"mark"},{id:"m_bad",name:"調子が悪い",color:"#c8322a",group:"mark"},{id:"m_gou",name:"合トレ",color:"#c23a6b",group:"mark"},{id:"m_pt",name:"パーソナル",color:"#8a4fc4",group:"mark"}];
function ensureMarks(){if(!tags.some(t=>t.group==="mark")){const have=new Set(tags.filter(t=>!t.deleted).map(t=>t.name));tags=tags.concat(defaultMarks().filter(m=>!have.has(m.name)))}}
const tagById=id=>tags.find(t=>t.id===id);
const dayTagList=k=>(dayTags[k]||[]).map(tagById).filter(Boolean);
let viewMode=(()=>{try{const v=localStorage.getItem("kintore-view");if(v==="list"||v==="cal")return v}catch(e){}return window.innerWidth<700?"list":"cal"})();
let statsZero=false,editRuleId=null,openDays=new Set(),editing=false,openArch=null,perMode=null;
let curId=null,sel=todayK;

const sorted=()=>periods.slice().sort((a,b)=>((a.ord??1e9)-(b.ord??1e9))||(a.start<b.start?-1:1));
const P=id=>periods.find(p=>p.id===id);
const cur=()=>P(curId);
const plen=p=>diff(p.start,p.end)+1;
const inP=(p,k)=>k>=p.start&&k<=p.end;
const periodFor=k=>periods.find(p=>inP(p,k));
const pLabel=(p,y)=>(y?parse(p.start).getFullYear()+"年 ":"")+mdk(p.start)+"〜"+mdk(p.end);
// 計画（期間）が重なる日：種目ごとにどの計画のものかを planSrc[日付][種目id] に持つ
const covering=k=>sorted().filter(q=>inP(q,k));
function srcOf(k,id){const cs=covering(k);if(!cs.length)return null;const v=planSrc[k]&&planSrc[k][id];return cs.find(q=>q.id===v)||cs[0]}
function defSrc(k){const c=cur(),cs=covering(k);return c&&inP(c,k)?c.id:(cs[0]?cs[0].id:null)}
function setSrc(k,id,pid){if(!pid)return;(planSrc[k]=planSrc[k]||{})[id]=pid}
// 計画を選んでいるときは、その計画の種目だけを見せる（一覧モードは全部）
function visIds(dk){if(allMode)return dayItems(dk);const p=cur();if(!p||!inP(p,dk))return [];return dayItems(dk).filter(id=>srcOf(dk,id)===p)}
function chipsFor(dk){const ids=visIds(dk),cs=allMode?covering(dk):[];
  const chip=id=>{const r=itemById(id),n=doneSets(dk,id).length;return el("span",{class:"lchip",style:"background:"+r.cat.color},r.item.name,n?el("span",{class:"ls"},n+"set"):null)};
  if(cs.length<2)return el("div",{class:"lchips"},...ids.map(chip));
  const box=el("div",{class:"lgroups"});
  cs.forEach(q=>{const mine=ids.filter(id=>srcOf(dk,id)===q);box.append(el("div",{class:"lgrp"},el("span",{class:"lgl"},q.name||pLabel(q)),mine.length?el("div",{class:"lchips"},...mine.map(chip)):el("span",{class:"lnone"},"なし")))});
  return box}
function pickInitial(){const t=periodFor(todayK);if(t){curId=t.id;sel=todayK;return}
  const s=sorted();if(!s.length){curId=null;return}
  const next=s.find(p=>p.start>todayK),prev=s.filter(p=>p.end<todayK).pop(),p=next||prev;curId=p.id;sel=p.start}
function fixSel(){const p=cur();if(!p){curId=null;return}if(!inP(p,sel))sel=inP(p,todayK)?todayK:p.start}

// ---------- lookups ----------
// 種目ツリー：cats＝いちばん上のフォルダ。フォルダの items には種目と子フォルダ（kind:"f"）が混ざって並ぶ
const isF=n=>n&&n.kind==="f";
let IDX={items:{},folders:{}},IDXsig="";
function rebuildIdx(){const items={},folders={};
  const walk=(arr,path,color,dead)=>arr.forEach(n=>{
    if(isF(n)||path.length===0){const col=n.color||color,d=dead||!!n.deleted,pth=path.concat([n]);folders[n.id]={f:n,path:pth,color:col,deleted:d,all:[]};
      pth.forEach(a=>{});walk(n.items||[],pth,col,d)}
    else{const d=dead||!!n.deleted;items[n.id]={item:n,path,color,deleted:d,cat:{color,deleted:dead,name:path[0].name}};path.forEach(f=>folders[f.id].all.push(n.id))}});
  walk(cats,[],COLORS[0],false);IDX={items,folders}}
const baseId=id=>String(id).split("#")[0];
function itemById(id){const r=IDX.items[baseId(id)];return r?{cat:r.cat,item:r.item,path:r.path}:null}
function catById(id){const r=IDX.folders[id];return r?r.f:null}
const live=c=>{const r=c&&IDX.folders[c.id];return r?!r.deleted:!(c&&c.deleted)};
const liveItems=c=>{const r=IDX.folders[c.id];return r?r.all.map(id=>IDX.items[id]).filter(x=>!x.deleted).map(x=>x.item):[]};
const pathName=r=>r&&r.path?r.path.map(f=>f.name).join(" › "):"";
// フォルダごとに、直下の種目をまとめた選択肢グループ（ルール・テンプレートの選択欄用）
function folderGroups(){const out=[];const walk=(arr,path)=>arr.forEach(n=>{if(!(isF(n)||path.length===0))return;if(n.deleted)return;const pth=path.concat([n]);out.push({f:n,path:pth,items:(n.items||[]).filter(x=>!isF(x)&&!x.deleted)});walk(n.items||[],pth)});walk(cats,[]);return out}
function selName(s){if(!s)return "?";const[t,id]=s.split(":");if(t==="c"){const c=catById(id);return c?"【"+c.name+"】全部":"(不明)"}const r=itemById(id);return r?r.item.name:"(不明)"}
function selKnown(s){if(!s)return false;const[t,id]=s.split(":");return t==="c"?!!catById(id):!!itemById(id)}
function selLive(s){if(!selKnown(s))return false;const[t,id]=s.split(":");if(t==="c")return live(catById(id));const r=itemById(id);return live(r.cat)&&!r.item.deleted}
function dayItems(k){return (plan[k]||[]).filter(id=>itemById(id))}
function matches(s,ids){ids=ids.map(baseId);const[t,id]=s.split(":");if(t==="i")return ids.includes(id);const r=IDX.folders[id];return !!r&&ids.some(x=>r.all.includes(x))}
const pRules=p=>p&&Array.isArray(p.rules)?p.rules:null;

// ---------- rules ----------
function freqRange(r){const d=r.d||7;if(r.max>=99)return d+"日で最低"+r.min+"回";if(r.min==r.max)return d+"日で"+r.min+"回";return d+"日で"+r.min+"〜"+r.max+"回"}
function ruleText(r){
  if(r.type==="gap")return selName(r.a)+" の"+(r.n==1?"翌日":"後 "+r.n+"日間")+"は "+selName(r.b)+" を入れない"+(r.both?"（逆も）":"");
  if(r.type==="freq")return selName(r.a)+" を "+freqRange(r);
  if(r.type==="same")return selName(r.a)+" と "+selName(r.b)+" を同じ日にしない";
  return "";

const SEED={"cats": [{"color": "#d4561c", "id": "7synawt", "items": [{"id": "c8b941y", "name": "ベンチ9割"}, {"id": "6pb4x0y", "name": "ベンチ7割"}, {"id": "daiyvo3", "name": "ダンベルプレス"}], "name": "胸"}, {"color": "#2f6fd0", "id": "i1us2f2", "items": [{"id": "45uah5d", "name": "デッドリフト"}, {"id": "l5rbud5", "name": "懸垂"}, {"id": "81mflf5", "name": "ローイング"}], "name": "背中"}, {"color": "#2f8a57", "id": "e9b6h5u", "items": [{"id": "117e0pf", "name": "スクワット"}, {"id": "wu4kol4", "name": "レッグプレス"}], "name": "脚"}, {"color": "#8a4fc4", "id": "xotib05", "items": [{"id": "h5hk2c7", "name": "ショルダープレス"}, {"id": "4fq1afl", "name": "サイドレイズ"}], "name": "肩"}, {"color": "#c23a6b", "id": "bk3mpcs", "items": [{"id": "7uez3o6", "name": "カール"}, {"id": "ih9sd1l", "name": "トライセプス"}], "name": "腕"}], "plan": {"2026-10-02": ["6pb4x0y"]}, "notes": {}, "periods": [{"end": "2026-10-04", "id": "p0928", "rules": [], "start": "2026-09-28"}], "updatedAt": 0};
let updatedAt=0,fbUser=null,fbDb=null,unsub=null,pushT=null;
const storeObj=()=>({cats,plan,planSrc,dayMemo,notes,periods,tags,dayTags,logs,templates,exNotes,trash,customUnits,updatedAt});
function applyStore(s){cats=clone(s.cats||[]);plan=clone(s.plan||{});planSrc=clone(s.planSrc||{});dayMemo=clone(s.dayMemo||{});notes=clone(s.notes||{});periods=clone(s.periods||[]);tags=s.tags?clone(s.tags):defaultTags();ensureMarks();dayTags=clone(s.dayTags||{});logs=clone(s.logs||{});templates=clone(s.templates||[]);exNotes=clone(s.exNotes||{});trash=clone(s.trash||[]);customUnits=clone(s.customUnits||[]);rebuildIdx();updatedAt=s.updatedAt||0}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(storeObj()))}catch(e){}}
function lsLoad(){try{const s=JSON.parse(localStorage.getItem(LS)||"null");if(s&&s.cats){applyStore(s);return}}catch(e){}applyStore(SEED)}
function setSync(msg,state){$("sync").replaceChildren(el("span",{class:"sync-dot"+(state?" "+state:"")}),document.createTextNode(msg))}
const stamp=t=>{if(!t)return"";const d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
function touch(){updatedAt=Date.now();lsSave();push();if(!histApplying)histNote()}
// ===== 戻す／進む（操作の履歴） =====
let hist=[],hpos=-1,histT=null,histApplying=false;
const histKeys=["cats","plan","planSrc","dayMemo","notes","periods","tags","dayTags","logs","templates","exNotes","trash"];
function snapState(){return JSON.stringify({cats,plan,planSrc,dayMemo,notes,periods,tags,dayTags,logs,templates,exNotes,trash,customUnits})}
function histCommit(){clearTimeout(histT);histT=null;const st=snapState();if(hist[hpos]===st)return;hist=hist.slice(0,hpos+1);hist.push(st);if(hist.length>60)hist.shift();hpos=hist.length-1;paintHist()}
// 文字入力中はまとめて1回分、ボタン操作などはその都度1回分として記録
function histNote(){const a=document.activeElement;if(a&&a.matches&&a.matches("input[type=text],input:not([type]),textarea")&&!a.closest("#appbar")){clearTimeout(histT);histT=setTimeout(histCommit,900);paintHist(true)}else histCommit()}
function histReset(){hist=[snapState()];hpos=0;paintHist()}
function histGo(d){if(histT)histCommit();const to=hpos+d;if(to<0||to>=hist.length)return;hpos=to;const o=JSON.parse(hist[hpos]);
  cats=o.cats;plan=o.plan;planSrc=o.planSrc||{};dayMemo=o.dayMemo||{};notes=o.notes;periods=o.periods;tags=o.tags;dayTags=o.dayTags;logs=o.logs;templates=o.templates;exNotes=o.exNotes;trash=o.trash||[];customUnits=o.customUnits||[];
  rebuildIdx();if(curId&&!P(curId))pickInitial();histApplying=true;try{touch()}finally{histApplying=false}render();toast(d<0?"ひとつ前に戻しました":"やり直しました")}
function paintHist(pending){const u=$("hUndo"),r=$("hRedo");if(!u)return;const pend=!!(pending||histT);u.disabled=!(hpos>0||pend);r.disabled=pend||!(hpos<hist.length-1);const n=$("hTrashN");if(n){n.hidden=!trash.length;n.textContent=String(trash.length)}}
$("hBrand").onclick=()=>{tab="menu";perMode=null;render();window.scrollTo({top:0,behavior:"smooth"})};
$("hUndo").onclick=()=>histGo(-1);$("hRedo").onclick=()=>histGo(1);
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!e.target.closest("input,textarea")){e.preventDefault();histGo(e.shiftKey?1:-1)}});
// ===== ごみ箱（30日間保管） =====
const DAY_MS=864e5,KEEP_DAYS=30;
function trashAdd(type,kind,name,data){trash.unshift({tid:"tr_"+uid(),type,kind,name,at:Date.now(),data})}
function purgeTrash(){const lim=Date.now()-KEEP_DAYS*DAY_MS,old=trash.filter(x=>x.at<lim);if(!old.length)return false;old.forEach(x=>hardDelete(x));trash=trash.filter(x=>x.at>=lim);return true}
function hardDelete(x){
  if(x.type==="node"){const pr=parentOf(x.data.id);if(pr){const i=pr.arr.findIndex(n=>n.id===x.data.id);if(i>=0)pr.arr.splice(i,1)}}
  if(x.type==="tag"){tags=tags.filter(t=>t.id!==x.data.id);Object.keys(dayTags).forEach(k=>{dayTags[k]=dayTags[k].filter(id=>id!==x.data.id);if(!dayTags[k].length)delete dayTags[k]})}
  // tpl / period / day は、ごみ箱から消せばそれで完全に削除
}
function restoreTrash(x){
  if(x.type==="node"){const r=IDX.folders[x.data.id]||IDX.items[x.data.id];const node=catById(x.data.id)||(IDX.items[x.data.id]||{}).item;if(!node){toast("戻す場所が見つかりませんでした");return false}
    node.deleted=false;(r&&r.path?r.path:[]).forEach(f=>{if(f.deleted){f.deleted=false;trash=trash.filter(y=>!(y.type==="node"&&y.data.id===f.id))}})}
  if(x.type==="tag"){const t=tagById(x.data.id);if(t)t.deleted=false}
  if(x.type==="tpl"){templates.splice(Math.min(x.data.i,templates.length),0,x.data.t)}
  if(x.type==="period"){periods.push(x.data.p);const kp=x.data.keep||{};["plan","notes","dayTags","logs","exNotes"].forEach(f=>{const dst={plan,notes,dayTags,logs,exNotes}[f];Object.entries(kp[f]||{}).forEach(([k,v])=>{if(dst[k]==null)dst[k]=v})})}
  if(x.type==="date"){const d=x.data,dst={plan,logs,notes,exNotes,dayTags};Object.keys(dst).forEach(f=>{if(d[f]==null)return;if(dst[f][d.k]==null)dst[f][d.k]=d[f];else if(f==="logs"||f==="exNotes"){Object.entries(d[f]).forEach(([id,v])=>{if(dst[f][d.k][id]==null)dst[f][d.k][id]=v})}else if(Array.isArray(d[f])){d[f].forEach(v=>{if(!dst[f][d.k].includes(v))dst[f][d.k].push(v)})}})}
  if(x.type==="day"){const d=x.data,a=plan[d.k]||[];if(!a.includes(d.id)){a.splice(Math.max(0,Math.min(d.idx,a.length)),0,d.id);plan[d.k]=a}if(d.l){logs[d.k]=logs[d.k]||{};logs[d.k][d.id]=d.l}if(d.x)setExNote(d.k,d.id,d.x)}
  return true}
function renderTrash(){
  const box=$("trashList");if(!box||tab!=="trash")return;box.replaceChildren();const row=$("trashAllRow");row.replaceChildren();
  if(!trash.length){box.append(el("div",{class:"empty"},"ごみ箱は空です。"));return}
  trash.forEach(x=>{const left=Math.max(0,Math.ceil((x.at+KEEP_DAYS*DAY_MS-Date.now())/DAY_MS)),d=new Date(x.at);
    box.append(el("div",{class:"trow2"},el("div",{class:"th"},el("span",{class:"tk"},x.kind),el("span",{class:"tn2"},x.name)),
      el("div",{class:"td"},(d.getMonth()+1)+"/"+d.getDate()+" に削除・あと"+left+"日で完全に削除"),
      el("div",{class:"btnrow"},el("button",{class:"primary",onclick:()=>{if(restoreTrash(x)){trash=trash.filter(y=>y.tid!==x.tid);rebuildIdx();touch();render();toast("「"+x.name+"」を戻しました")}}},"戻す"),
        armed("完全に削除",x.type==="node"?"記録の表示も消えます。OK？":"本当に？",()=>{hardDelete(x);trash=trash.filter(y=>y.tid!==x.tid);rebuildIdx();touch();render();toast("完全に削除しました")},"ghost danger"))))});
  row.append(armed("ごみ箱を空にする","全部完全に消す？",()=>{trash.forEach(hardDelete);trash=[];rebuildIdx();touch();render();toast("ごみ箱を空にしました")},"ghost danger"));
}
$("hTrash").onclick=()=>{if(tab!=="trash")prevTab=tab;tab="trash";render();window.scrollTo({top:0})};
$("trashBack").onclick=()=>{tab=prevTab||"menu";render();window.scrollTo({top:0})};
function saveCfg(){rebuildIdx();touch()} function savePlan(){touch()} function savePeriods(){touch()}
function push(now){if(!fbUser||!fbDb){setSync("この端末に保存（ログインすると全端末で同期）");return}
  setSync("同期中…","on");clearTimeout(pushT);
  pushT=setTimeout(()=>{fbDb.collection(FB_COLLECTION).doc(fbUser.uid).set({dataJson:JSON.stringify(storeObj()),updatedAt})
    .then(()=>setSync("同期しました（"+stamp(updatedAt)+"）","on")).catch(e=>setSync("保存エラー（"+(e&&e.code||"")+"）","err"))},now?0:800)}
function startSync(){if(unsub)unsub();
  unsub=fbDb.collection(FB_COLLECTION).doc(fbUser.uid).onSnapshot(snap=>{
    if(!snap.exists){push(true);return}
    if(snap.metadata.hasPendingWrites)return;
    let remote=null;try{remote=JSON.parse((snap.data()||{}).dataJson)}catch(e){}
    if(!remote)return;
    if((remote.updatedAt||0)>updatedAt){applyStore(remote);lsSave();histCommit();if(!cur()||!userNavigated)pickInitial();render();setSync("最新に同期しました（"+stamp(updatedAt)+"）","on")}
    else if((remote.updatedAt||0)<updatedAt)push(true);
    else setSync("同期済み（"+stamp(updatedAt)+"）","on");
  },e=>setSync("同期エラー（"+(e&&e.code||"")+"）","err"))}
function initFirebase(){
  if(typeof firebase==="undefined"){setSync("同期ライブラリを読み込めませんでした。この端末に保存します","err");$("authBtn").hidden=true;return}
  try{firebase.initializeApp(FB_CONFIG);fbDb=firebase.firestore();
    firebase.auth().onAuthStateChanged(u=>{fbUser=u;$("authBtn").textContent=u?"ログアウト":"Googleでログイン";
      if(u){setSync("ログイン中："+(u.email||u.displayName||""),"on");startSync()}
      else{if(unsub){unsub();unsub=null}setSync("未ログイン（この端末だけに保存）")}});
    firebase.auth().getRedirectResult().catch(()=>{});
  }catch(e){setSync("同期の初期化に失敗しました。この端末に保存します","err")}}
$("authBtn").addEventListener("click",()=>{
  if(typeof firebase==="undefined"||!firebase.auth)return;
  if(fbUser){firebase.auth().signOut();return}
  const provider=new firebase.auth.GoogleAuthProvider();setSync("ログイン処理中…");
  firebase.auth().signInWithPopup(provider).catch(err=>{const c=err&&err.code||"";
    if(["auth/popup-blocked","auth/cancelled-popup-request","auth/operation-not-supported-in-this-environment","auth/popup-closed-by-user"].includes(c))firebase.auth().signInWithRedirect(provider);
    else setSync("ログインできませんでした（"+c+"）","err")})});

lsLoad();ensureMarks();rebuildIdx();if(purgeTrash()){rebuildIdx();lsSave()}histReset();pickInitial();render();initFirebase();
// 日付が変わった状態で戻ってきたら「今日」を更新して、今日の期間を開き直す
function refreshToday(){const t=new Date();t.setHours(0,0,0,0);const k=key(t);if(k===todayK)return;today=t;todayK=k;userNavigated=false;pickInitial();render()}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refreshToday()});
window.addEventListener("focus",refreshToday);setInterval(refreshToday,60000);
})();
</script>
